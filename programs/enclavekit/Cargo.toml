[package]
name = "enclavekit"
version = "0.1.0"
description = "Smart wallet controlled by an iPhone Secure Enclave P-256 key via the secp256r1 precompile"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "enclavekit"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
devnet = []


[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
enclavekit-encoding = { path = "../../crates/enclavekit-encoding", default-features = false }
solana-instructions-sysvar = "3.0.1"
solana-sha256-hasher = "3.1.0"

[dev-dependencies]
enclavekit-encoding = { path = "../../crates/enclavekit-encoding" }
litesvm = { version = "0.16.0", features = ["precompiles"] }
p256 = { version = "0.14.0", features = ["ecdsa"] }
solana-secp256r1-program = "3.0.0"
solana-precompile-error = "3.0.0"
solana-message = "4.2.4"
solana-transaction = { version = "4.1.5", features = ["serde"] }
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
solana-transaction-error = "3.3.2"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
solana-hash = "4.5.0"
# examples/kora_transfer_sol: JSON-RPC to Kora and devnet
ureq = { version = "3.3.0", features = ["json"] }
serde_json = "1.0"
base64 = "0.22"
bincode = "1.3"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
