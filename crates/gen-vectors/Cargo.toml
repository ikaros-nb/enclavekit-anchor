[package]
name = "gen-vectors"
version = "0.1.0"
description = "Writes the conformance vectors the Swift SDK is tested against"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
enclavekit-encoding = { path = "../enclavekit-encoding" }
enclavekit = { path = "../../programs/enclavekit", features = ["no-entrypoint"] }
anchor-lang = "1.2.0"
borsh = "1.8.1"
p256 = { version = "0.14.0", features = ["ecdsa"] }
solana-secp256r1-program = "3.0.0"
solana-message = "4.2.4"
solana-transaction = { version = "4.1.5", features = ["serde"] }
solana-hash = "4.5.0"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
